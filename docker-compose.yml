services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port ${BACKEND_PORT:-8000}
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      ARTIFACTS_PATH: ${ARTIFACTS_PATH:-./ml/artifacts}
    volumes:
      - ./ml:/app/ml:ro

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8000}
    ports:
      - "5173:80"
    depends_on:
      - backend
